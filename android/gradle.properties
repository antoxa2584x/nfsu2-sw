org.gradle.jvmargs=-Xmx4g
android.useAndroidX=false
android.nonTransitiveRClass=true

# --- NFSU2 native build inputs (override with -P... or in ~/.gradle/gradle.properties) ---
# Lifted C from tools/regen.sh (never committed; ~100 MB).
# nfsu2.genDir=/path/to/gen
# VP6-only FFmpeg for Android (tools/build_ffmpeg_vp6.sh android); optional,
# without it the (slow) lifted decoder plays the movies.
# nfsu2.ffmpegDir=/path/to/ffmpeg-vp6-android
